
name: Lesson 2

on:
  push:
    branches:
      - lesson-2

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test environment
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r hangry_api/requirements.txt
          pip install pytest django_mock_queries six coverage

      - name: Run unit tests
        working-directory: backend
        run: |
          python -m coverage run --source=./hangry_api -m pytest
          python -m coverage report

  deploy:
    needs: [unit_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Disable Debug
        run: |
          sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/hangry_api/settings.py

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Placeholder Deploy to Elastic Beanstalk
        run: echo "Placeholder for Deployment"
